<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Key Girişi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111 url("neonsehir1.jpeg") no-repeat center center/cover;
      color: white;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    #login {
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
    }
    input {
      padding: 10px;
      margin-top: 10px;
      width: 200px;
      border: none;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      margin-top: 15px;
      background: #c0392b;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background: #e74c3c;
    }
    #hata {
      color: #e74c3c;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="login">
    <h2 style="color:white;">Giriş Yap</h2>
    <input type="password" id="keyInput" placeholder="Key giriniz" />
    <br />
    <button onclick="kontrolEt()">Giriş</button>
    <p id="hata">Yanlış key, tekrar dene!</p>
  </div>

  <script>
    const dogruKey = "drownbabafirar01"; // Yeni key burada

    function kontrolEt() {
      const girilenKey = document.getElementById("keyInput").value;
      if (girilenKey === dogruKey) {
        localStorage.setItem("girisYapildi", "true");
        alert("Giriş başarılı! Yönlendiriliyorsunuz...");
        setTimeout(() => {
          window.location.href = "panel.html";
        }, 1500); // 1.5 saniye sonra yönlendirme
      } else {
        document.getElementById("hata").style.display = "block";
      }
    }
  </script>

</body>
</html>
